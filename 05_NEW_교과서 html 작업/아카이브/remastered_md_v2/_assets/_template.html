<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Noto+Serif+KR:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)'], ['$','$']],
    displayMath: [['\\[','\\]'], ['$$','$$']]
  },
  chtml: {
    mtextInheritFont: true,
    matchFontHeight: false,
    displayAlign: 'center',
    displayIndent: '0'
  },
  options: { enableMenu: false, renderActions: { addMenu: [] } },
  startup: { ready: () => { MathJax.startup.defaultReady(); } }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>

<style>
:root{
  --bg:#F0EEE6; --paper:#FAF9F5; --paper-2:#F4F1E9;
  --ink:#211F1B; --ink-2:#56514A; --ink-3:#8A857C; --line:#E4DFD3;
  --coral:#D97757; --coral-d:#B0501F; --coral-tint:#FBEEE7; --coral-tint-bd:#F1D7C7;
  --dark:#262019; --dark-2:#2F2820; --cream:#F4EFE6; --cream-2:#D6CFBF;
  --amber:#EAB45C; --coral-l:#EC9A78; --teal-l:#86C0A9; --tan:#D4A27F;
  --f1:#CF6A45; --f2:#BB852C; --f3:#3F7A66; --f4:#8A5A86; --f5:#4E6E94;
  --font-serif:"Newsreader","Noto Serif KR",Georgia,serif;
  --font-sans:"Pretendard",-apple-system,BlinkMacSystemFont,"Noto Sans KR",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-sans); font-size:20px; line-height:1.72;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  word-break:keep-all; overflow-wrap:break-word;
  display:grid; grid-template-columns:312px 1fr;
}

/* ---------- progress bar ---------- */
.progress{position:fixed; top:0; left:312px; right:0; height:4px; background:transparent; z-index:60;}
.progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--coral),var(--amber)); transition:width .25s ease;}
.counter{position:fixed; right:26px; bottom:22px; z-index:60;
  font-family:var(--font-mono); font-size:13px; letter-spacing:.06em; color:var(--ink-2);
  background:rgba(250,249,245,.88); border:1px solid var(--line); border-radius:999px;
  padding:7px 14px; backdrop-filter:blur(6px);}

/* ---------- TOC ---------- */
.toc{position:sticky; top:0; height:100vh; overflow-y:auto; z-index:50;
  background:#EBE7DD; border-right:1px solid var(--line); padding:30px 20px 60px;}
.toc::-webkit-scrollbar{width:8px;} .toc::-webkit-scrollbar-thumb{background:#D7D1C4; border-radius:8px;}
.brand{padding:0 8px 18px; border-bottom:1px solid var(--line); margin-bottom:14px;}
.brand .k{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--coral-d);}
.brand .t{font-family:var(--font-serif); font-size:26px; font-weight:600; line-height:1.14; margin-top:6px; color:var(--ink);}
.toc-group{margin:15px 0 4px;}
.toc-gh{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; letter-spacing:.03em;
  color:var(--ink-3); text-transform:uppercase; padding:6px 8px 4px;}
.dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
.dot.f1{background:var(--f1)} .dot.f2{background:var(--f2)} .dot.f3{background:var(--f3)} .dot.f4{background:var(--f4)} .dot.f5{background:var(--f5)}
.toc-link{display:block; text-decoration:none; color:var(--ink-2); font-size:14px; line-height:1.32;
  padding:6px 10px 6px 12px; border-radius:8px; border-left:2px solid transparent; transition:all .15s;}
.toc-link:hover{background:rgba(217,119,87,.10); color:var(--ink);}
.toc-link.active{background:var(--paper); color:var(--coral-d); font-weight:600; border-left-color:var(--coral);
  box-shadow:0 1px 4px rgba(0,0,0,.05);}

/* ---------- deck / cards ---------- */
.deck{min-width:0;}
.card{min-height:100vh; display:flex; flex-direction:column; justify-content:center;
  padding:76px 72px; border-bottom:1px solid var(--line); scroll-margin-top:0; position:relative;}
.card.top{justify-content:flex-start; padding-top:84px;}
.wrap{width:100%; max-width:1080px; margin:0 auto;}
.card.dark{background:var(--dark); color:var(--cream); border-bottom-color:#3a3228;}
.card.center{text-align:center;}
.card.center .wrap{margin:0 auto;}

.khead{display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
.sec{font-family:var(--font-mono); font-size:14px; font-weight:600; letter-spacing:.04em;
  color:var(--ink-3); background:rgba(0,0,0,.045); padding:3px 11px; border-radius:7px;}
.card.dark .sec{color:var(--amber); background:rgba(255,255,255,.08);}
.eyebrow{font-size:15.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;}
.f1{color:var(--f1)} .f2{color:var(--f2)} .f3{color:var(--f3)} .f4{color:var(--f4)} .f5{color:var(--f5)}
.card.dark .eyebrow{color:var(--amber);}

h2{font-family:var(--font-serif); font-weight:500; font-size:clamp(36px,4.6vw,58px);
  line-height:1.13; letter-spacing:-.012em; margin:.05em 0 .5em;}
.card.dark h2{color:#fff;}
h2 em{font-style:italic; color:var(--coral-d);}
.card.dark h2 em{color:var(--amber);}
.lead{font-size:clamp(21px,2vw,26px); line-height:1.55; color:var(--ink); margin:0 0 .7em;}
.card.dark .lead{color:var(--cream);}
p{font-size:clamp(18.5px,1.5vw,22px); line-height:1.72; margin:.55em 0;}
.muted{color:var(--ink-2);} .card.dark .muted{color:var(--cream-2);}
.gloss{color:var(--ink-3); font-size:.9em;} .card.dark .gloss{color:var(--cream-2);}
strong{font-weight:700; color:var(--coral-d);} .card.dark strong{color:var(--amber);}
b{font-weight:700; color:var(--ink);} .card.dark b{color:#fff;}
.hl{background:linear-gradient(transparent 58%, rgba(234,180,92,.45) 58%); padding:0 1px; color:inherit; font-weight:600;}
.card.dark .hl{background:linear-gradient(transparent 58%, rgba(234,180,92,.30) 58%);}

ul{margin:.5em 0; padding-left:0; list-style:none;}
ol{margin:.5em 0; padding-left:1.4em;}
ol li{padding:5px 0; font-size:clamp(17.5px,1.45vw,21px); line-height:1.6;}
ul li{position:relative; padding:7px 0 7px 26px; font-size:clamp(17.5px,1.45vw,21px); line-height:1.6; list-style:none;}
ul li::before{content:""; position:absolute; left:4px; top:.95em; width:7px; height:7px; border-radius:50%;
  background:var(--coral);}
.card.dark ul li::before{background:var(--amber);}
ul li.x::before{content:"✕"; background:none; color:var(--coral-d); font-size:.8em; top:.7em; left:2px; width:auto; height:auto;}
.card.dark ul li.x::before{color:var(--coral-l);}
ul li.o::before{content:"✓"; background:none; color:var(--f3); font-weight:700; top:.55em; left:0; width:auto; height:auto;}
.card.dark ul li.o::before{color:var(--amber);}

/* ---------- citations / flags ---------- */
.cite{font-family:var(--font-mono); font-size:.64em; font-weight:500; color:var(--ink-3);
  background:rgba(0,0,0,.045); padding:2px 8px; border-radius:6px; white-space:nowrap; vertical-align:middle; letter-spacing:.01em;}
.card.dark .cite{color:var(--cream-2); background:rgba(255,255,255,.10);}
.box .cite{background:rgba(0,0,0,.05);}
.box.dark .cite{color:var(--cream-2); background:rgba(255,255,255,.12);}
.flag{font-family:var(--font-mono); font-size:.62em; font-weight:600; letter-spacing:.02em; color:var(--coral-d);
  background:rgba(217,119,87,.10); border:1px solid var(--coral-tint-bd); padding:2px 8px; border-radius:6px; white-space:nowrap; vertical-align:middle;}
.card.dark .flag, .box.dark .flag{color:var(--amber); background:rgba(234,180,92,.12); border-color:rgba(234,180,92,.32);}

/* ---------- boxes / callouts ---------- */
.box{background:var(--paper); border:1px solid var(--line); border-left:5px solid var(--ac,var(--coral));
  border-radius:13px; padding:20px 25px; margin:18px 0;}
.box .bh{display:flex; align-items:center; gap:9px; font-weight:700; font-size:1.02em;
  color:var(--ac,var(--coral-d)); margin-bottom:.45em;}
.box .ico{font-size:1.05em; filter:saturate(1.1);}
.box p, .box li{font-size:clamp(17px,1.38vw,20px);}
.box.dark{background:var(--dark-2); border-color:rgba(255,255,255,.12); border-left-color:var(--ac,var(--amber)); color:var(--cream);}
.box.dark .bh{color:var(--amber);}
.box.dark strong{color:var(--amber);} .box.dark b{color:#fff;}
.box.dark ul li::before{background:var(--amber);}
.box.dark .muted{color:var(--cream-2);}

.key{background:var(--coral-tint); border:1px solid var(--coral-tint-bd); border-left:5px solid var(--coral);
  border-radius:13px; padding:20px 26px; margin:18px 0; font-size:clamp(18.5px,1.5vw,22px); line-height:1.55;}
.key .lbl{display:inline-block; font-family:var(--font-mono); font-size:12px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--coral-d); margin-bottom:.35em;}
.key strong{color:var(--coral-d);}
.card.dark .key{background:rgba(234,180,92,.10); border-color:rgba(234,180,92,.3); border-left-color:var(--amber); color:var(--cream);}
.card.dark .key .lbl{color:var(--amber);} .card.dark .key strong{color:var(--amber);} .card.dark .key b{color:#fff;}

.thread{font-family:var(--font-serif); font-style:italic; font-size:clamp(17.5px,1.5vw,22px);
  color:var(--ink-2); border-top:1px dashed var(--line); padding-top:16px; margin-top:22px; display:flex; gap:10px;}
.thread .ico{font-style:normal;}
.thread b{color:var(--coral-d);}
.card.dark .thread{color:var(--cream-2); border-top-color:rgba(255,255,255,.18);}
.card.dark .thread b{color:var(--amber);}

/* ---------- stats ---------- */
.stats{display:flex; flex-wrap:wrap; gap:14px 30px; align-items:flex-end; margin:14px 0 6px;}
.stat{display:flex; flex-direction:column; gap:2px;}
.stat .lab{font-size:14.5px; color:var(--ink-2); letter-spacing:.01em;}
.card.dark .stat .lab{color:var(--cream-2);}
.stat .val{font-family:var(--font-serif); font-weight:500; font-size:clamp(34px,4.4vw,58px); line-height:1; color:var(--ink);}
.stat .val .u{font-size:.42em; color:var(--ink-2); font-family:var(--font-sans); font-weight:500;}
.card.dark .stat .val{color:#fff;} .card.dark .stat .val .u{color:var(--cream-2);}
.arrow{font-family:var(--font-serif); font-size:clamp(30px,3.4vw,46px); color:var(--coral); align-self:center; padding-bottom:.18em;}
.card.dark .arrow{color:var(--coral-l);}
.bignum{font-family:var(--font-serif); font-weight:500; font-size:clamp(64px,10vw,140px); line-height:.9; color:var(--coral-d);}
.card.dark .bignum{color:var(--amber);}

/* ---------- tables ---------- */
.tbl{width:100%; overflow-x:auto; margin:16px 0;}
table{width:100%; border-collapse:collapse; font-size:clamp(15px,1.3vw,18.5px);}
th,td{text-align:left; padding:12px 15px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.5;}
thead th{font-weight:700; color:var(--coral-d); border-bottom:2px solid var(--coral); font-size:.94em; letter-spacing:.01em;}
tbody tr:last-child td{border-bottom:none;}
td .em{color:var(--coral-d); font-weight:600;}
tr.hot td{background:rgba(234,180,92,.13);}
.card.dark th,.card.dark td{border-bottom-color:rgba(255,255,255,.13); color:var(--cream);}
.card.dark thead th{color:var(--amber); border-bottom-color:var(--amber);}
.card.dark td .em{color:var(--amber);}
.card.dark tr.hot td{background:rgba(234,180,92,.16);}
.box table{font-size:clamp(14.5px,1.2vw,17px);}
.fcell{display:inline-flex; align-items:center; gap:7px; font-weight:600;}

/* ---------- math ---------- */
.mathblock{font-size:clamp(21px,2.15vw,30px); margin:1.2em 0; overflow-x:auto; overflow-y:hidden; padding:8px 2px;}
.mathblock.tight{margin:.6em 0;}
.mathblock.tall{margin:1.6em 0; padding:14px 2px;}
.mathblock.wide{font-size:clamp(15.5px,1.7vw,22px);}
mjx-container{color:inherit !important;}
mjx-container[display="true"]{margin:0 !important;}
.card.dark .mathblock, .box.dark .mathblock, .key .mathblock{color:inherit;}
.formula-hero{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:16px 22px; margin:18px 0;}
.card.dark .formula-hero{background:rgba(255,255,255,.04); border-color:rgba(255,255,255,.12);}
.box.dark .formula-hero, .key .formula-hero{background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.14);}

/* ---------- params chips ---------- */
.params{display:flex; flex-wrap:wrap; gap:10px; margin:14px 0;}
.chip{font-family:var(--font-mono); font-size:15px; background:var(--paper-2); border:1px solid var(--line);
  border-radius:9px; padding:8px 13px; color:var(--ink);}
.chip b{color:var(--coral-d);}
.card.dark .chip{background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.14); color:var(--cream);}
.card.dark .chip b{color:var(--amber);}

/* ---------- grids ---------- */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:16px 0;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin:16px 0;}
@media (max-width:1180px){ .grid3{grid-template-columns:1fr;} }

/* ---------- code ---------- */
.codeblock{font-family:var(--font-mono); background:var(--dark); color:var(--cream); border-radius:14px;
  padding:18px 22px; margin:12px 0; font-size:clamp(12.5px,1.05vw,15px); line-height:1.7;
  overflow-x:auto; border:1px solid rgba(255,255,255,.10);}
.codeblock .ttl{display:block; color:var(--amber); font-weight:600; margin-bottom:8px; font-size:.95em;}
.codeblock pre{margin:0; white-space:pre;}
.codeblock .cm{color:var(--coral-l);}
.codeblock .kw{color:var(--amber);}

/* ---------- flow ---------- */
.flow{font-family:var(--font-mono); background:var(--dark); color:var(--cream); border-radius:14px;
  padding:22px 26px; margin:16px 0; font-size:clamp(14px,1.25vw,17px); line-height:1.85;}
.flow .step{color:var(--amber); font-weight:600;}
.flow .ar{color:var(--coral-l);}

/* ---------- Q&A ---------- */
.qa{margin:10px 0;}
.qa .q{font-weight:700; color:var(--ink); font-size:clamp(16.5px,1.35vw,19px); margin-top:15px; display:flex; gap:10px;}
.qa .q .n{font-family:var(--font-mono); color:var(--coral-d); flex:0 0 auto;}
.qa .q .lv{font-family:var(--font-mono); font-size:.7em; color:var(--ink-3); margin-left:auto; white-space:nowrap;}
.qa .a{color:var(--ink-2); font-size:clamp(15.5px,1.3vw,18px); padding-left:30px; margin-top:3px; line-height:1.58;}
.qa .a b{color:var(--coral-d);}
.card.dark .qa .q{color:#fff;} .card.dark .qa .q .n{color:var(--amber);} .card.dark .qa .a{color:var(--cream-2);} .card.dark .qa .a b{color:var(--amber);}

.scroll-hint{position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
  font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--cream-2); opacity:.8;
  display:flex; flex-direction:column; align-items:center; gap:6px;}
.scroll-hint .dn{font-size:18px; animation:bob 1.8s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)} 50%{transform:translateY(5px)}}

.foot{margin-top:26px; font-size:14.5px; color:var(--ink-3); letter-spacing:.01em;}
.card.dark .foot{color:var(--cream-2);}
.divider{height:1px; background:var(--line); margin:20px 0;}
.card.dark .divider{background:rgba(255,255,255,.14);}

/* ---------- burger / mobile ---------- */
.burger{display:none; position:fixed; top:14px; left:14px; z-index:70; width:46px; height:46px;
  border-radius:11px; background:var(--dark); color:var(--cream); border:none; cursor:pointer; font-size:20px;}
@media (max-width:980px){
  body{grid-template-columns:1fr; font-size:18px;}
  .toc{position:fixed; left:0; top:0; width:300px; transform:translateX(-100%); transition:transform .25s; box-shadow:0 0 40px rgba(0,0,0,.25);}
  body.toc-open .toc{transform:translateX(0);}
  .burger{display:block;}
  .progress{left:0;}
  .card{padding:78px 26px 64px;}
  .card.top{padding-top:78px;}
  .grid2{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<button class="burger" aria-label="목차 열기">☰</button>
<div class="progress"><i id="bar"></i></div>
<div class="counter" id="counter">{{COUNTER}}</div>

{{BODY}}

<script>
(function(){
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var links = Array.prototype.slice.call(document.querySelectorAll('.toc-link'));
  var bar = document.getElementById('bar');
  var counter = document.getElementById('counter');
  var tocEl = document.querySelector('.toc');
  var total = cards.length;
  var cur = 0;

  function linkFor(id){
    for(var i=0;i<links.length;i++){ if(links[i].getAttribute('href') === '#'+id) return links[i]; }
    return null;
  }
  function ensureVisible(l){
    var lr = l.getBoundingClientRect(), tr = tocEl.getBoundingClientRect();
    if(lr.top < tr.top + 8) tocEl.scrollTop -= (tr.top + 8 - lr.top);
    else if(lr.bottom > tr.bottom - 8) tocEl.scrollTop += (lr.bottom - (tr.bottom - 8));
  }
  function setActive(idx){
    cur = idx;
    var id = cards[idx].id;
    for(var i=0;i<links.length;i++) links[i].classList.remove('active');
    var l = linkFor(id);
    if(l){ l.classList.add('active'); ensureVisible(l); }
    counter.textContent = String(idx+1).padStart(2,'0') + ' / ' + String(total).padStart(2,'0');
    bar.style.width = ((idx+1)/total*100) + '%';
  }

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ setActive(cards.indexOf(e.target)); }
    });
  }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
  cards.forEach(function(c){ io.observe(c); });

  function go(d){
    var n = Math.max(0, Math.min(total-1, cur + d));
    if(n !== cur) cards[n].scrollIntoView({ behavior:'smooth', block:'start' });
  }
  window.addEventListener('keydown', function(e){
    if(e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if(e.key === 'ArrowDown' || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)){ e.preventDefault(); go(1); }
    else if(e.key === 'ArrowUp' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)){ e.preventDefault(); go(-1); }
    else if(e.key === 'Home'){ e.preventDefault(); cards[0].scrollIntoView({behavior:'smooth'}); }
    else if(e.key === 'End'){ e.preventDefault(); cards[total-1].scrollIntoView({behavior:'smooth'}); }
  });

  var burger = document.querySelector('.burger');
  if(burger){
    burger.addEventListener('click', function(){ document.body.classList.toggle('toc-open'); });
    links.forEach(function(l){ l.addEventListener('click', function(){ document.body.classList.remove('toc-open'); }); });
  }

  setActive(0);
})();
</script>
</body>
</html>
